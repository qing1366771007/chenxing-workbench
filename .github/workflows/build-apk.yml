name: Build APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apk_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

# 显式声明权限时，未列出的权限会被置为 none
permissions:
  contents: write
  actions: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # AGP 8.1 要求 Gradle 8.x；官方源在 runner 上取不到 → 官方失败自动切腾讯云镜像
      - name: Install Gradle 8.3
        run: |
          cd "$RUNNER_TEMP"
          if curl -fsSL --retry 2 --max-time 120 -o gradle.zip \
               https://services.gradle.org/distributions/gradle-8.3-bin.zip; then
            echo "官方源下载成功"
          else
            echo "官方源失败，改用腾讯云镜像"
            rm -f gradle.zip
            curl -fsSL --retry 3 --max-time 120 -o gradle.zip \
              https://mirrors.cloud.tencent.com/gradle/gradle-8.3-bin.zip
          fi
          ls -lh gradle.zip
          unzip -q gradle.zip
          echo "$RUNNER_TEMP/gradle-8.3/bin" >> "$GITHUB_PATH"

      - name: Gradle & Android SDK info
        run: |
          gradle --version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_SDK_ROOT" 2>/dev/null || echo "SDK 目录不存在"
          ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || echo "platforms 不存在"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: apk_app

      # 统一成英文文件名，Release 下载链接干净、手机识别正常
      - name: Rename APK
        run: cp apk_app/app/build/outputs/apk/debug/app-debug.apk chenxing-workbench.apk

      - name: Upload APK (Actions 产物，保留 90 天)
        uses: actions/upload-artifact@v4
        with:
          name: chenxing-workbench-apk
          path: chenxing-workbench.apk

      # 固定 tag = apk-latest，每次覆盖同一个 Release 的安装包
      # 固定下载链接：
      # https://github.com/qing1366771007/chenxing-workbench/releases/download/apk-latest/chenxing-workbench.apk
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 辰星工作台 APK 最新版
          body: |
            自动构建 · commit ${{ github.sha }}
            手机点下方 chenxing-workbench.apk 直接下载安装。
          files: chenxing-workbench.apk
          make_latest: true
          draft: false
          prerelease: false

      # 失败时把环境快照提交回仓库，方便本地直接查原因（不匹配 paths，不会循环触发）
      - name: Dump env on failure
        if: failure()
        run: |
          {
            echo "# 构建失败环境快照"
            echo ""
            echo "时间: $(date -u)"
            echo ""
            echo "## gradle --version"
            echo '```'
            gradle --version 2>&1 || echo "gradle 不可用"
            echo '```'
            echo ""
            echo "## Android SDK"
            echo '```'
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_SDK_ROOT" 2>&1 || true
            echo "--- platforms ---"
            ls "$ANDROID_SDK_ROOT/platforms" 2>&1 || true
            echo "--- build-tools ---"
            ls "$ANDROID_SDK_ROOT/build-tools" 2>&1 || true
            echo '```'
          } > ci-env.md
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add ci-env.md
          git commit -m "ci: 构建失败环境快照 [skip ci]" || true
          git push origin HEAD:main || true
