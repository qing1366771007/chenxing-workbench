name: keepalive

# 给 Render 免费实例保活：免费计划 15 分钟无请求就休眠，下次打开要等 30~60 秒
# 两条 cron 错峰（0/10/20… 和 5/15/25…），平均 5 分钟打一次，容忍 GitHub 的调度延迟
# 只在北京时间 05:00-23:00 保活（UTC 21:00-15:00），每天 18 小时≈558h/月
# 理由：Render 免费档只有 750 实例小时/月，24h 全保活要 744h，一旦超额当整月会被停，比冷启动更糟
on:
  schedule:
    - cron: '0,10,20,30,40,50 0-14,21-23 * * *'
    - cron: '5,15,25,35,45,55 0-14,21-23 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake Render instance
        run: |
          URL="https://chenxing-workbench.onrender.com/api/health"
          for i in 1 2 3; do
            echo "--- try $i ---"
            if curl -fsS --max-time 120 "$URL"; then
              echo ""
              echo "OK: instance is awake"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::keepalive ping failed 3 times"
          exit 1
